schema_version = "1.0.0"

id = "sprongmotion"
version = "1.0.0"
name = "SprongMotion"
tagline = "Text to motion for armatures, as prompt blocks on the timeline"
maintainer = "SegerEnd"
website = "https://github.com/SegerEnd/sprongmotion-blender"
type = "add-on"
tags = ["Animation", "Rigging"]
blender_version_min = "5.0.0"
license = ["SPDX:GPL-3.0-or-later"]
copyright = ["2026 Seger Endendijk"]

[permissions]
files = "Load the SprongMotion runtime and model, export BVH files"

[build]
paths_exclude_pattern = ["__pycache__/", "/.git/", "/.venv/", "/.ruff_cache/", "/dist/", "/tests/", "/Makefile", "/ruff.toml",
                         "/README.md", "/docs/", "/CHANGELOG.md", "/CONTRIBUTING.md", "/SECURITY.md", "/CITATION.cff", "/release.sh", "/.github/", ".*"]
